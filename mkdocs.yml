site_name: IPTVBoss Guide
site_description: Official user guide and documentation for IPTVBoss
site_url: https://guide.iptvboss.pro/

docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/branding/banner_logo.png
  favicon: assets/branding/cropped-logo.png
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - First Run: getting-started/first-run.md
      - Updating IPTVBoss: getting-started/updating.md
  - Sources and Setup:
      - Adding Playlists: setup/playlists.md
      - Adding EPG Sources: setup/epg-sources.md
      - Universal EPG: setup/universal-epg.md
      - Source and EPG Tools: setup/source-tools.md
      - Browsing EPG Data: setup/epg-browser.md
      - Channel Mapping: setup/channel-mapping.md
      - Creating Output: setup/output.md
      - Cloud Output Links: setup/output-links.md
  - Layouts:
      - Layout Overview: layouts/index.md
      - Layout Manager: layouts/layout-manager.md
      - Layout Editor: layouts/layout-editor.md
      - Layout Output Settings: layouts/output-settings.md
      - User Management: layouts/users.md
  - Features:
      - Feature Overview: features/index.md
      - Advanced EPG Dummies: features/aed.md
      - Custom Sports: features/custom-sports.md
  - Server:
      - Server Overview: server/index.md
      - Server Settings: server/settings.md
      - Server User Management: server/users.md
  - Settings:
      - Application Settings: settings/application.md
      - Preferences and Theme: settings/preferences.md
      - Automatic Synchronization: settings/automation.md
      - Sync Schedule: settings/scheduling.md
      - AI Settings: settings/ai.md
      - Pro and Account Access: settings/pro.md
      - Email Notifications: settings/email.md
  - Troubleshooting:
      - Common Problems: troubleshooting/common-problems.md
      - Logs and Diagnostics: troubleshooting/logs.md
      - Resetting IPTVBoss: troubleshooting/reset.md
      - Recovery and Application Files: troubleshooting/recovery.md
  - Frequently Asked Questions: faq.md
  - Support: support.md
