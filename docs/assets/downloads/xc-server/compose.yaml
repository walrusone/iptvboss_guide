# DRAFT — Still Requires Final Review & Testing.
# This example intentionally uses the IPTVBoss Alpha image.
services:
  iptvboss:
    image: "ghcr.io/walrusone/iptvboss-alpha:${IPTVBOSS_TAG:-alpha}"
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 60s
    user: "${IPTVBOSS_UID:-10001}:${IPTVBOSS_GID:-10001}"
    environment:
      IPTVBOSS_XC_BEHIND_HTTPS_PROXY: "true"
      IPTVBOSS_XC_ALLOW_DIRECT_HTTP: "false"
      IPTVBOSS_XC_BIND_ADDRESS: "all"
      IPTVBOSS_XC_TRUSTED_PROXIES: "${IPTVBOSS_XC_TRUSTED_PROXIES:-}"
    ports:
      - "127.0.0.1:${IPTVBOSS_HOST_PORT:-8001}:8001"
    volumes:
      - iptvboss-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  iptvboss-data:
