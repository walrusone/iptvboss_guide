name: Documentation issue
description: Report incorrect, outdated, unclear, or missing IPTVBoss documentation.
title: "[Docs]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the IPTVBoss guide. Use the member portal for account-specific or private support, and never include credentials, tokens, or private URLs here.

  - type: input
    id: page
    attributes:
      label: Affected guide page
      description: Paste the guide URL or provide the page title.
      placeholder: https://guide.iptvboss.pro/...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is incorrect, unclear, or missing?
      description: Describe the documentation problem and its effect on the workflow.
    validations:
      required: true

  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
      description: Explain the wording, steps, screenshot, or link you expected, if known.

  - type: input
    id: version
    attributes:
      label: IPTVBoss version
      description: Include the version only when the problem may depend on the application release.
      placeholder: For example, 3.12 Beta

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed provider credentials, private URLs, tokens, license keys, customer information, and other secrets.
          required: true
